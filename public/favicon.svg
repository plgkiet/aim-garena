<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c232d"/>
      <stop offset="1" stop-color="#0c1015"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7e8a99"/>
      <stop offset="0.55" stop-color="#e3eaf2"/>
      <stop offset="1" stop-color="#9aa6b5"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#tile)"/>
  <rect x="2" y="2" width="60" height="60" rx="13" fill="none" stroke="#ffb648" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- knife: an M9 blade running corner to corner behind the reticle -->
  <g transform="rotate(45 32 32)">
    <path d="M33.6 3.5 Q27.6 13 28.4 22 L28.4 40 L35.6 40 L35.6 12.5 Z" fill="url(#steel)"/>
    <path d="M35.6 17 l1.6 1.2 l-1.6 1.2 l1.6 1.2 l-1.6 1.2 l1.6 1.2 l-1.6 1.2 l1.6 1.2 l-1.6 1.2" fill="none" stroke="#9aa6b5" stroke-width="1.1"/>
    <rect x="25.2" y="40" width="13.6" height="3.2" rx="1.2" fill="#ffb648"/>
    <rect x="28.6" y="43.2" width="6.8" height="12.8" rx="2.2" fill="#2a2f36"/>
    <rect x="28.6" y="46" width="6.8" height="1.3" fill="#454c55"/>
    <rect x="28.6" y="50" width="6.8" height="1.3" fill="#454c55"/>
  </g>

  <!-- reticle -->
  <circle cx="32" cy="32" r="14.5" fill="none" stroke="#0c1015" stroke-width="7" stroke-opacity="0.55"/>
  <circle cx="32" cy="32" r="14.5" fill="none" stroke="#ffb648" stroke-width="3.6"/>
  <g stroke="#ffb648" stroke-width="3.6" stroke-linecap="round">
    <line x1="32" y1="6.5" x2="32" y2="12.5"/>
    <line x1="32" y1="51.5" x2="32" y2="57.5"/>
    <line x1="6.5" y1="32" x2="12.5" y2="32"/>
    <line x1="51.5" y1="32" x2="57.5" y2="32"/>
  </g>
  <circle cx="32" cy="32" r="3.4" fill="#ff4b3e"/>
</svg>
